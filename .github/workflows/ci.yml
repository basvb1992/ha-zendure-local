name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # continue-on-error: the only remaining check this repository fails
      # is "brands" (no icon submitted to home-assistant/brands yet -- a
      # separate, longer-term community submission, not something a
      # single commit here can fix). It only blocks eventual inclusion in
      # HACS's own default store, not installation via "Add custom
      # repository", which is this integration's documented install path.
      # See README.md#brand-assets.
      - uses: hacs/action@main
        continue-on-error: true
        with:
          category: integration
